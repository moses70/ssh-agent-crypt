[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-agent-crypt"
version = "1.0.0"
description = "Multi-key file encryption and decryption backed by a running SSH agent (SSH_AGENT_SOCK / SSH_AUTH_SOCK) with zero CLI secrets."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Reinhard Moosauer" },
]
keywords = [
    "ssh-agent",
    "encryption",
    "cryptography",
    "sops",
    "age",
    "ansible",
    "secrets",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/moses70/ssh-agent-crypt"
Repository = "https://github.com/moses70/ssh-agent-crypt"
Issues = "https://github.com/moses70/ssh-agent-crypt/issues"

[project.scripts]
ssh-agent-crypt = "ssh_agent_crypt.cli:main"

[tool.setuptools.packages.find]
include = ["ssh_agent_crypt*"]
