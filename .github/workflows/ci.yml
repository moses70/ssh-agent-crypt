name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run unit and live ssh-agent integration tests
        run: ./scripts/run-tests.sh

      - name: Run isolated end-to-end demo workflow
        run: ./scripts/demo-workflow.sh

      - name: Smoke-test CLI entrypoint and completion output
        run: |
          ssh-agent-crypt --version
          ./ssh-agent-crypt install --dry-run
          ./ssh-agent-crypt completion bash --alias ssc | bash -n
